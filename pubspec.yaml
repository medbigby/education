# ============================================================
#  CONFIGURATION pubspec.yaml
#  Ajoutez ces sections dans votre fichier pubspec.yaml existant
# ============================================================

name: education
description: Mini-jeu d'apprentissage de la lettre arabe ب
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

#  DÉPENDANCES
# ============================================================
dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.0.0
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
 
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0
 
# ============================================================
#  CONFIGURATION ICÔNE — logo.png
# ============================================================
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0D47A1"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true

  # ── Assets : placez vos fichiers dans ces chemins ──────────
  assets:
    - assets/images/classroom_normal.png      # GIF classe calme (fond normal)
